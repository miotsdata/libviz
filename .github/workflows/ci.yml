name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.13"
          # Pinned to the PDM version pdm.lock was generated with, so a
          # future PDM release can't silently start rejecting it.
          version: "2.28.0"
          cache: true

      # PySide6 needs real shared libraries even headless. Same list as
      # MSIAnalyzer's ci.yml (worked out there against ubuntu:24.04); it
      # still has QtWebEngine-era extras (nss, atk, cups, ...) not trimmed.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgl1 libegl1 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            libnss3 libnspr4 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxext6 \
            libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libgbm1 \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbfile1 libwayland-client0 libwayland-egl1 libwayland-cursor0 \
            fonts-liberation libatspi2.0-0t64 libx11-xcb1 libxi6 libxcursor1

      - name: Install dependencies
        run: pdm install -G:all -d

      # Advisory: no [tool.pylint] config yet, and PySide6's compiled
      # bindings give no-name-in-module false positives.
      - name: Lint (advisory)
        run: pdm run pylint src/libviz || true

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # Slow 500k-spectra tests stay local (pytest -m slow).
        run: pdm run pytest -q
