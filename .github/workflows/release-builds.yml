name: Release builds

# Builds the wheel + sdist, the Windows installer and the Linux AppImage
# and publishes them as GitHub *Release* assets (never Actions artifacts:
# on a private repo those count against the 500 MB storage quota, and an
# app build alone is about that big). Same layout as MSIAnalyzer (ADR 7).
#
# - Run manually (Actions tab > Release builds > Run workflow, or
#   `gh workflow run release-builds.yml --ref <branch>`): replaces the
#   single `dev-build` pre-release with this build. Never touches PyPI.
# - Push a `v*` tag: creates a normal release for that tag and, once
#   every build passed, publishes the wheel + sdist to PyPI.
#
# No push/PR trigger on purpose: builds cost runner minutes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  # Manual runs publish to one rolling pre-release; tags to their own.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-build' }}

jobs:
  # The release must exist before the builds upload into it; creating it
  # here once avoids the build jobs racing to create it.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A PyPI version can never be re-uploaded: refuse a tag that doesn't
      # match pyproject.toml before anything is built or published.
      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "Tag $GITHUB_REF_NAME != v$version (pyproject.toml)"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$RELEASE_TAG" --generate-notes
          else
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
            gh release create "$RELEASE_TAG" --prerelease \
              --target "$GITHUB_SHA" \
              --title "Dev build (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
              --notes "Latest manual build from \`${GITHUB_REF_NAME}\`. Replaced on every run."
          fi

  wheel:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.13"
          # Same pin as ci.yml: the PDM version pdm.lock was made with.
          version: "2.28.0"

      - name: Build wheel + sdist
        run: pdm build

      # 0.1.2 once shipped a wheel with no code in it.
      - name: Check the wheel has the package
        run: unzip -l dist/*.whl | grep -q "libviz/gui/qml/Main.qml"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber

  windows:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.13"
          version: "2.28.0"
          cache: true

      - name: Install dependencies
        run: pdm install -G:all -d

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build app + installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      # Catches the classic frozen-app failures (a pruned DLL, a missing
      # hidden import, a QML module left out) without anyone opening it.
      # LIBVIZ_SMOKE_TEST makes gui.main compile every view, create a
      # library (runs the bundled migrations) and exit 0.
      - name: Smoke test (app starts, QML compiles, migrations run)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          LIBVIZ_SMOKE_TEST: "1"
        run: |
          $p = Start-Process dist\libviz-gui\libviz-gui.exe -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "App did not finish within 120 s" }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit $($p.ExitCode))" }

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/LibViz-setup-*.exe --clobber

  linux:
    needs: release
    # Not ubuntu-latest: an AppImage only runs on systems with at least
    # the glibc it was built against, so build on the oldest supported
    # base (22.04 → glibc 2.35, also covers RHEL/Rocky 9).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.13"
          version: "2.28.0"
          cache: true

      # ci.yml's list, with 22.04's package names (no `t64` suffixes,
      # that rename came with 24.04). Needed to run the frozen app in the
      # smoke test.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgl1 libegl1 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            libnss3 libnspr4 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxext6 \
            libasound2 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libgbm1 \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbfile1 libwayland-client0 libwayland-egl1 libwayland-cursor0 \
            fonts-liberation libatspi2.0-0 libx11-xcb1 libxi6 libxcursor1

      - name: Install dependencies
        run: pdm install -G:all -d

      - name: Build app + AppImage
        run: packaging/appimage/build.sh

      # Same check as the Windows job, on the AppImage itself.
      - name: Smoke test (app starts, QML compiles, migrations run)
        env:
          QT_QPA_PLATFORM: offscreen
          LIBVIZ_SMOKE_TEST: "1"
        run: timeout 120 dist/LibViz-x86_64.AppImage --appimage-extract-and-run

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/LibViz-x86_64.AppImage --clobber

  # Tags only, and only after every build (incl. both smoke tests) passed:
  # a broken release must never reach PyPI, where a version can't be
  # replaced. Uses PyPI Trusted Publishing (no token stored anywhere); it
  # needs a one-time setup on pypi.org, see docs/release.md.
  pypi:
    needs: [wheel, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read  # gh release download
      id-token: write  # Trusted Publishing
    steps:
      - name: Download wheel + sdist from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$RELEASE_TAG" --pattern "*.whl" --pattern "*.tar.gz" --dir dist

      - uses: pypa/gh-action-pypi-publish@release/v1
