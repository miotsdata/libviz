[project]
name = "LibViz"
version = "0.1.4"
description = "App to visualize MS library spectra"
authors = [{ name = "Matteo Miotto", email = "miotsdata@gmail.com" }]
# Core-only dependencies (no GUI)
dependencies = [
    "sqlalchemy>=2.0.46",
    "alembic>=1.18.4",
    "pandas>=3.0.0",
    "numpy>=2.4.2",
    "pyteomics>=4.7.5",
    "tqdm>=4.67.3",
    "lxml>=6.0.2",
]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = { text = "MIT" }

# Optional extras
[project.optional-dependencies]
# Not the `pyside6` meta-package: it pulls WebEngine, which the GUI does not
# use. Qt Graphs (spectrum plots) lives in Addons and needs >= 6.12 (zoom/pan).
gui = ["pyside6-essentials>=6.12.0", "pyside6-addons>=6.12.0"]
all = ["libviz[gui]"]

[project.scripts]
libviz-gui = "libviz.gui.main:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = ["src/libviz/"]
excludes = ["src/libviz/old", "tests", "**/.DS_Store"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pylint>=4.0.4",
    "hupper>=1.12.1",
    "pyinstaller>=6.19.0",
    "pytest-qt>=4.5.0",
    "archunitpython>=1.8.1",
]
