[project]
name = "LibViz"
version = "0.1.1"
description = "App to visualize MS library spectra"
authors = [{ name = "Matteo Miotto", email = "miotsdata@gmail.com" }]
# Core-only dependencies (no GUI)
dependencies = [
    "sqlalchemy>=2.0.46",
    "alembic>=1.18.4",
    "pandas>=3.0.0",
    "numpy>=2.4.2",
    "pyteomics>=4.7.5",
    "tqdm>=4.67.3",
    "lxml>=6.0.2",
]
requires-python = "==3.13"
readme = "README.md"
license = { text = "MIT" }

# Optional extras
[project.optional-dependencies]
gui = ["pyside6>=6.10.2", "pyqt6>=6.10.2", "PySide6-Essentials>=6.10.2"]
all = ["libviz[gui]"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
excludes = ["src/libviz/old", "tests", "**/.DS_Store"]
includes = ["migrations/", "alembic.ini"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pylint>=4.0.4",
    "pyside6-stubs>=6.7.3.0",
    "hupper>=1.12.1",
    "pyinstaller>=6.19.0",
]
