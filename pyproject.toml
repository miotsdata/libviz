[project]
name = "LibViz"
version = "0.1.0"
description = "App to visualize MS library spectra"
authors = [
    {name = "Matteo Miotto", email = "miotsdata@gmail.com"},
]
dependencies = ["sqlalchemy>=2.0.46", "pyside6>=6.10.2", "pyqt6>=6.10.2", "alembic>=1.18.3", "pandas>=3.0.0", "numpy>=2.4.2", "PySide6-Essentials>=6.10.2", "pyteomics>=4.7.5", "tqdm>=4.67.3"]
requires-python = "==3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pylint>=4.0.4",
    "pyside6-stubs>=6.7.3.0",
    "hupper>=1.12.1",
    "pyinstaller>=6.19.0",
]
